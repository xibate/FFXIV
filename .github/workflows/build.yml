name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Dalamud.NET.Sdk looks for Dalamud in ~/.xlcore/dalamud/Hooks/dev on Linux.
      - name: Download Dalamud
        run: |
          mkdir -p ~/.xlcore/dalamud/Hooks/dev
          curl -sSL https://goatcorp.github.io/dalamud-distrib/latest.zip -o dalamud.zip
          unzip -oq dalamud.zip -d ~/.xlcore/dalamud/Hooks/dev

      - name: Build
        run: dotnet build LucentUI.slnx -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: LucentUI
          path: LucentUI/bin/Release/LucentUI/

      # Pushing a tag like v0.1.0.0 publishes a release that the custom repo (repo.json) installs from.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LucentUI/bin/Release/LucentUI/latest.zip
